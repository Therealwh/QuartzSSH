name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 3"

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ${{ matrix.os }}
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            language: javascript-typescript
          - os: windows-latest
            language: rust
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: github/codeql-action/init@018511a1aac61b6e92783189d8c0081eb8f69932 # v3.28.13
        with:
          languages: ${{ matrix.language }}
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        if: matrix.language == 'rust'
      - name: Install NASM (ring backend on Windows)
        if: matrix.language == 'rust'
        shell: pwsh
        run: |
          choco install nasm -y --no-progress
          echo "$env:ProgramFiles\NASM" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - uses: github/codeql-action/autobuild@018511a1aac61b6e92783189d8c0081eb8f69932 # v3.28.13
        if: matrix.language == 'rust'
      - uses: github/codeql-action/analyze@018511a1aac61b6e92783189d8c0081eb8f69932 # v3.28.13
        with:
          category: "/language:${{ matrix.language }}"
