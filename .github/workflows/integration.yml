name: Integration tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  ssh-integration:
    # Real-protocol suite: an OpenSSH container plus the russh/russh-sftp
    # stack used by the application. Locally the tests skip themselves when
    # the QUARTZSSH_TEST_SSH_* variables are not set.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Rust cache
        uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
        with:
          workspaces: src-tauri
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Generate throwaway test keypair
        run: ssh-keygen -t ed25519 -N "" -f "$HOME/.ssh/quartzssh_test_key" -C "quartzssh-ci-test"
      - name: Start OpenSSH server container
        run: |
          docker run -d --name quartzssh-sshd -p 2222:2222 \
            -e PUBLIC_KEY="$(cat "$HOME/.ssh/quartzssh_test_key.pub")" \
            -e USER_NAME=tester \
            -e PASSWORD_ACCESS=false \
            lscr.io/linuxserver/openssh-server:latest
          for i in $(seq 1 30); do
            if ssh -p 2222 -i "$HOME/.ssh/quartzssh_test_key" \
                 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
                 tester@127.0.0.1 true 2>/dev/null; then
              echo "sshd is ready"
              exit 0
            fi
            sleep 2
          done
          echo "sshd did not become ready"
          docker logs quartzssh-sshd
          exit 1
      - name: Run integration suite
        working-directory: src-tauri
        env:
          QUARTZSSH_TEST_SSH_HOST: 127.0.0.1
          QUARTZSSH_TEST_SSH_PORT: 2222
          QUARTZSSH_TEST_SSH_USER: tester
          QUARTZSSH_TEST_SSH_KEY: /home/runner/.ssh/quartzssh_test_key
        run: cargo test --locked
      - name: Dump server logs on failure
        if: failure()
        run: docker logs quartzssh-sshd
