name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build frontend
        run: npx vite build
      - name: Tests
        run: npx vitest run

  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy, rustfmt
      - name: Rust cache
        uses: Swatinem/rust-cache@aa7c1c80a07a27a84c0aa76d0cef0aad3830e330 # v2.7.8
        with:
          workspaces: src-tauri
      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Install NASM (ring backend on Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: choco install nasm -y --no-progress
      - name: Add NASM to PATH
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: echo "$env:ProgramFiles\NASM" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Format check
        working-directory: src-tauri
        run: cargo fmt --check
      - name: Unit tests
        working-directory: src-tauri
        run: cargo test
      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy -- -D warnings

  actions-pinning:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Verify all actions are pinned to full commit SHAs
        run: |
          bad=$(grep -rhoE 'uses:[[:space:]]*[^ ]+@(v[0-9]+[^ ]*|main|master)' .github/workflows/ || true)
          if [ -n "$bad" ]; then
            echo "Unpinned action references found:"
            echo "$bad"
            exit 1
          fi
          echo "All actions are SHA-pinned."

  installer-size:
    # Acceptance budget: the Windows installer must stay at or below 20 MiB.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Rust cache
        uses: Swatinem/rust-cache@aa7c1c80a07a27a84c0aa76d0cef0aad3830e330 # v2.7.8
        with:
          workspaces: src-tauri
      - name: Install NASM (ring backend)
        shell: pwsh
        run: |
          choco install nasm -y --no-progress
          echo "$env:ProgramFiles\NASM" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - run: npm ci
      - name: Generate ephemeral updater signing key
        shell: pwsh
        run: |
          npx tauri signer generate -w "$env:RUNNER_TEMP\updater.key" --password "" --ci
          "TAURI_SIGNING_PRIVATE_KEY=$env:RUNNER_TEMP\updater.key" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build release bundle
        run: npm run tauri build
      - name: Enforce installer size budget
        shell: pwsh
        run: |
          $exe = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          if (-not $exe) { Write-Error "NSIS installer not found"; exit 1 }
          $mib = [math]::Round($exe.Length / 1MB, 2)
          Write-Host "Installer size: $mib MiB ($($exe.Name))"
          if ($exe.Length -gt 20MB) { Write-Error "Installer exceeds the 20 MiB acceptance budget"; exit 1 }

  secrets-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: No private keys or secrets in the tree
        run: |
          if git ls-files | grep -Ei '\.(key|ppk|pem)$|\.env$|SECRETS-README'; then
            echo "Secret-like files are tracked by git!"
            exit 1
          fi
          echo "Clean."
