<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- QuartzSSH logo: faceted quartz crystal with a connection spark -->
  <defs>
    <linearGradient id="qz-a" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7ee0d2"/>
      <stop offset=".5" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="qz-b" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c9f5ee"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="qz-c" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="#0f172a"/>
  <!-- crystal body: hexagonal shard -->
  <polygon points="256,72 352,168 320,416 192,416 160,168" fill="url(#qz-a)"/>
  <!-- left facet -->
  <polygon points="256,72 160,168 208,416 192,416 256,72" fill="url(#qz-c)" opacity=".9"/>
  <polygon points="160,168 192,416 256,416 208,300 160,168" fill="url(#qz-c)" opacity=".55"/>
  <!-- right facet highlight -->
  <polygon points="256,72 352,168 304,300 256,416 320,416 352,168" fill="url(#qz-b)" opacity=".38"/>
  <polygon points="256,72 304,236 352,168" fill="#eafcf8" opacity=".75"/>
  <!-- central facet seam: the "connection" line -->
  <polyline points="256,72 256,416" stroke="#0f172a" stroke-width="18" opacity=".85" fill="none"/>
  <polyline points="256,72 256,416" stroke="#eafcf8" stroke-width="6" opacity=".5" fill="none"/>
  <!-- connection spark: two nodes linked through the crystal -->
  <circle cx="256" cy="196" r="26" fill="#0f172a"/>
  <circle cx="256" cy="196" r="14" fill="#eafcf8"/>
  <circle cx="256" cy="316" r="26" fill="#0f172a"/>
  <circle cx="256" cy="316" r="14" fill="#eafcf8"/>
</svg>
