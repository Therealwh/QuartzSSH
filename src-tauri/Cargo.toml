[package]
name = "quartzssh"
version = "0.1.0"
description = "Lightweight, beautiful and fast open-source SSH/SFTP client"
authors = ["Therealwh"]
license = "MIT"
repository = "https://github.com/Therealwh/QuartzSSH"
edition = "2021"
rust-version = "1.89"

[lib]
name = "quartzssh_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "fs", "io-util", "net", "time"] }
russh = { version = "0.65", default-features = false, features = ["ring", "flate2", "rsa"] }
russh-sftp = "3.0"
keyring = "4"
base64 = "0.23"
sha1 = "0.10"
sha2 = "0.11"
hmac = "0.12"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
log = "0.4"
env_logger = "0.11"
dirs = "7"

[dev-dependencies]
# Thread RNG for generating throwaway Ed25519 host keys in known_hosts tests.
rand = "0.10"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
